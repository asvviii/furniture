  </head>

    <header>

    <section class="products">

        <img src="./image/s3.png" alt="" />
        <h2>Modern Sofa</h2>

        <button>Add to Cart</button>
      </article>
      <article class="product">
        <img src="./image/p3.png" alt="" />
        <h2>Classic sofa</h2>

      </article>

    </section>
